<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Create an account | GymBro</title>
	<link rel="stylesheet" href="register.css">
	<link rel="stylesheet" href="../../Global/style.css">
</head>
<body>
	<section>
		<header>
			<div class="hero-content">
				<img src="../images/Logo.png" alt="GymBro Logo" class="logo" />
				<div class="hero-text">
				<span class="hero-text-1">Gym</span>
				<span class="hero-text-2">BroUp</span>
				</div>
			</div>

			<div class="btn-container">
				<a href="../../index.html" class="home-btn">Back to homepage</a>
			</div>
		</header>
		<hr>
		<main>
			<div class="left-block">
				<div class="bg-image">
					<div class="left-text-block">
						<h1 class="bg-text">Your next level is waiting.</h1>
						<p class="bg-text2">Start your journey through the vast world of iron.</p>
						<hr class="bg-hr">
						<div class="txt-block">
							<img src="../images/progress.png" alt="Progress Icon" class="progress-icon" />
							<h3 class="slogan">Stronger every session. Better together.</h3>
						</div>
					</div>
				</div>
			</div>

			<div class="right-block">
				<div class="blue-title">
					<h3 class="micro-title2">IMPROVE YOUR LIFE TODAY</h3>
				</div>
				<div class="text-block">
					<h1>Create your account.</h1>
				</div>

				<form action="register-form" class="register-form">
					<div class="input-group">
						<div class="input-form">
							<label for="nickname" class="form-title">Username</label>
							<input class="input" type="text" id="nickname" name="nickname" placeholder="Create Username" aria-label="Username" autocomplete="username">
						</div>
						<div class="input-form">
							<label for="email" class="form-title">Email</label>
							<input class="input" type="email" id="email" name="email" placeholder="Enter your email" aria-label="Email" autocomplete="email">
						</div>
						<div class="input-form">
							<label for="phone" class="form-title">Phonenumber</label>
							<input class="input" type="tel" id="phone" name="phone" placeholder="Enter your phonenumber" aria-label="Phone number" autocomplete="tel">
						</div>
						<div class="input-form">
							<label for="password" class="form-title">Password</label>
							<input class="input" type="password" id="password" name="password" placeholder="Create password" aria-label="Password" autocomplete="new-password">
						</div>
					</div>

					<div class="register-button">
						<button class="register-btn">Sign Up</button>
					</div>
				</form>
				

			</div>
		</main>

		<hr>
		<footer>
			<div class="footer-block">
				<div class="hero-content">
					<a href="#">
						<img src="../images/AS-Legacy.png" alt="Boss Logo" class="boss-logo" />
					</a>
				</div>
				<div class="footer-text">
					<h6 class="foot-txt">A stronger you.</h6>
					<h6 class="foot-txt">A better together.</h6>
				</div>
				</div>
				<nav class="navigation">
				<a href="#" class="nav">Community</a>
				<a href="#" class="nav">Contact</a>
				</nav>

				<div class="some">
				<a href="#">
					<img src="../images/Instagram.png" class="instagram">
				</a>
			</div>
		</footer>
	</section>
    
</body>
</html>
